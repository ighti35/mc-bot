<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="panel-token" content="{{PANEL_TOKEN}}"><title>机器人 · 物品栏</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div><span class="eyebrow">MINECRAFT / BOT CONTROL</span><h1>机器人的物品栏<span class="dot" id="dot"></span></h1><p id="connection">正在连接本机机器人…</p></div><button id="refresh" class="secondary">刷新</button></header>
<section class="stats"><div><small>机器人</small><strong id="username">—</strong></div><div><small>生命 / 饥饿</small><strong id="vitals">—</strong></div><div><small>坐标</small><strong id="position">—</strong></div><div><small>背包占用</small><strong id="usage">— / 36</strong></div></section>
<section class="taskbar"><span id="task">正在获取状态</span><button id="stop" class="secondary">停止当前任务</button></section><div id="message" role="status" aria-live="polite"></div>
<div class="layout"><section class="card bag"><div class="cardtitle"><h2>背包</h2><small>点击格子查看 / 取出</small></div><div id="bag" class="grid"></div><h3>快捷栏</h3><div id="hotbar" class="grid"></div><h3>装备与副手</h3><div id="equipment" class="equipment"></div><p class="muted">格子会自动刷新。图标为物品类别示意，物品名称以文字为准。</p></section>
<aside><section class="card"><span class="eyebrow">SELECTED SLOT</span><h2 id="selected-title">选择一个物品</h2><p id="selected-info" class="muted">点击左侧背包中的格子。</p><label for="take-count">取出数量</label><input id="take-count" type="number" min="1" max="64" value="1"><button id="take">取出并交给我</button><p class="muted">机器人会走到主人面前丢出指定数量，请在游戏中拾取。附魔和自定义数据保留。</p></section>
<section class="card"><span class="eyebrow">ADMIN MODE</span><h2>添加物品</h2><label for="item">物品名称 / ID</label><input id="item" list="items" placeholder="例如：铁镐 / iron_pickaxe" value="iron_pickaxe" autocomplete="off"><datalist id="items"></datalist><label for="add-count">添加数量</label><input id="add-count" type="number" min="1" max="64" value="1"><button id="add">添加到背包</button><p id="permission" class="muted">正在检查管理权限…</p></section></aside></div><footer>本机面板 · 每秒同步 · Minecraft 连接端口 <span id="server-port">52591</span></footer></main></body></html>
